# Weekly security and version updates for every ecosystem in the repository.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/stem-splitter
    schedule:
      interval: weekly
