<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300">
  <title>Bandival</title>
  <defs>
    <linearGradient id="coolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Emblem: stage diamond with microphone -->
  <g transform="translate(60, 10)">
    <path d="M 10 90 L 150 10 L 290 90 L 150 170 Z" fill="none" stroke="url(#coolGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
    <line x1="150" y1="60" x2="80" y2="0" stroke="#fef08a" stroke-width="1" opacity="0.6"/>
    <line x1="150" y1="60" x2="220" y2="0" stroke="#fef08a" stroke-width="1" opacity="0.6"/>
    <path d="M 100 60 Q 150 0, 200 60" stroke="#f472b6" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 115 75 Q 150 30, 185 75" stroke="#f472b6" stroke-width="1.5" fill="none" opacity="0.8"/>
    <rect x="135" y="70" width="30" height="90" rx="15" fill="#ffffff"/>
    <rect x="142" y="75" width="16" height="50" rx="3" fill="#a1a1aa"/>
    <circle cx="150" cy="60" r="18" fill="url(#coolGrad)"/>
    <path d="M 150 10 L 155 18 L 165 20 L 157 26 L 160 36 L 150 30 L 140 36 L 143 26 L 135 20 L 145 18 Z" fill="#fef08a" filter="url(#neonGlow)"/>
    <path d="M 270 45 L 273 51 L 280 54 L 273 57 L 270 63 L 267 57 L 260 54 L 267 51 Z" fill="#22d3ee" filter="url(#neonGlow)"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(0, 196)">
    <path d="M 25 10 L 65 10 C 80 10, 85 25, 85 35 C 85 45, 80 50, 65 50 C 65 50, 85 55, 85 70 C 85 85, 75 90, 60 90 L 25 90 C 15 90, 10 80, 10 70 L 10 30 C 10 20, 15 10, 25 10 Z" fill="url(#coolGrad)"/>
    <path d="M 35 30 L 55 30 C 60 30, 65 32, 65 37 C 65 42, 60 44, 55 44 L 35 44 Z" fill="#ffffff"/>
    <path d="M 35 56 L 55 56 C 60 56, 65 58, 65 63 C 65 68, 60 70, 55 70 L 35 70 Z" fill="#ffffff"/>
    <text x="100" y="85" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="900" fill="#ffffff">AND</text>
    <text x="250" y="85" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="300" font-style="italic" fill="url(#coolGrad)"><tspan font-weight="900">ı</tspan>val</text>
    <circle cx="263" cy="38" r="6.5" fill="#f472b6" filter="url(#neonGlow)"/>
    <path d="M 370 30 L 375 38 L 385 40 L 377 46 L 380 56 L 370 50 L 360 56 L 363 46 L 355 40 L 365 38 Z" fill="#f472b6" filter="url(#neonGlow)"/>
    <path d="M 410 62 L 413 68 L 420 71 L 413 74 L 410 80 L 407 74 L 400 71 L 407 68 Z" fill="#22d3ee" filter="url(#neonGlow)"/>
  </g>
</svg>
