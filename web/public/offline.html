<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline · Bandival</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --fg: #18181b; --muted: #71717a; --accent: #0e7490; }
    @media (prefers-color-scheme: dark) { :root { --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --accent: #22d3ee; } }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
    .mark { display: block; width: 56px; height: 56px; margin: 0 auto 20px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; font-size: 15px; line-height: 1.5; max-width: 320px; }
    button { border: 0; border-radius: 10px; padding: 11px 18px; font-size: 15px; font-weight: 600;
      background: var(--accent); color: #fff; cursor: pointer; }
    @media (prefers-color-scheme: dark) { button { color: #062a33; } }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/icon.svg" alt="" />
    <h1>Keine Verbindung</h1>
    <p>Bandival ist gerade nicht erreichbar. Bereits geöffnete Songs und Setlists sind weiterhin offline verfügbar.</p>
    <button type="button" onclick="location.reload()">Erneut versuchen</button>
  </main>
</body>
</html>
